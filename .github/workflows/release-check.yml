name: Release check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install locked root dependencies
        run: npm ci

      - name: Install locked client dependencies
        run: npm --prefix client ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gate with relay transition conformance
        run: PILLOWFORT_RELAY_CONFORMANCE_REPORT="$RUNNER_TEMP/relay-conformance.json" npm run check

      - name: Verify chat remains usable with limited vertical space
        run: bun test --timeout 60000 --max-concurrency 1 test/mobile.test.ts --test-name-pattern 'phone landscape|shrinks only'

      - name: Verify voluntary re-offer, post-transfer admission and game restart
        run: |
          npx playwright install --with-deps firefox
          NODE_ENV=production npm run build
          bun verification/app/browsers.ts "$RUNNER_TEMP/retoss.json" chromium retoss
          npm install --prefix "$RUNNER_TEMP/pf-npm" --ignore-scripts --no-audit --no-fund https://registry.npmjs.org/@ontologic/pillowfort-agent/-/pillowfort-agent-2.1.1.tgz
          pkg="$RUNNER_TEMP/pf-npm/node_modules/@ontologic/pillowfort-agent"
          node "$pkg/scripts/agent.mjs" install-browser
          for scenario in fresh-admission saboteur all-decline; do
            node verification/app/game-handoff.ts "$scenario" "$RUNNER_TEMP/$scenario.json" "$pkg"
          done

      - name: Verify a manual host choice waits for its matching authorization
        run: bun scripts/protocol-browser-evidence.ts --mode faults --fault manual-offer-readiness --output "$RUNNER_TEMP/pillowfort-manual-choice"

      - name: Verify a throttled participant resumes without duplicating delivery
        run: bun scripts/protocol-browser-evidence.ts --mode faults --fault guest-backpressure --output "$RUNNER_TEMP/guest-backpressure"

      - name: Verify a committed host offer across Worker eviction
        run: node scripts/protocol-workerd-evidence.mjs persisted-offer "$RUNNER_TEMP/pillowfort-offer"

      - name: Verify silent and one-way host loss without a transport close; tolerate a lost probe across hibernation
        run: |
          for cut in silent-host-loss silent-host-uplink silent-host-downlink probe-restart; do
            node scripts/protocol-workerd-evidence.mjs "$cut" "$RUNNER_TEMP/pillowfort-$cut"
          done
      - name: Verify idle retirement survives a Worker restart before and during notification
        run: |
          for cut in idle-retirement idle-retirement-prefix; do
            node scripts/protocol-workerd-evidence.mjs "$cut" "$RUNNER_TEMP/pillowfort-$cut"
          done
      - name: Verify a terminal notice survives a participant storage failure
        run: node scripts/protocol-workerd-evidence.mjs terminal-storage "$RUNNER_TEMP/pillowfort-terminal-storage"
      - name: Verify a guest with lost keys needs new approval and gets a distinct address
        run: bun scripts/protocol-browser-evidence.ts --mode faults --fault lost-guest-keys --output "$RUNNER_TEMP/lost-guest-keys"

      - name: Verify recovery after a peer cannot store a committed membership change
        run: bun scripts/protocol-browser-evidence.ts --mode faults --fault peer-storage --output "$RUNNER_TEMP/peer-storage"

  protocol-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check finite safety, mutations and recovery witnesses
        run: |
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          python3 scripts/check-protocol-models.py --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/pillowfort-models"

  hosted-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted-mcp/package-lock.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install shared runtime dependencies
        run: npm ci
      - name: Install hosted dependencies
        run: npm --prefix hosted-mcp ci
      - name: Install browser for OAuth consent regression
        run: npx playwright install --with-deps chromium
      - name: Validate hosted transport and security
        run: npm --prefix hosted-mcp run check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Audit locked dependencies
        run: |
          npm audit --package-lock-only --audit-level=moderate
          npm --prefix client audit --package-lock-only --audit-level=moderate
          npm --prefix hosted-mcp audit --package-lock-only --audit-level=moderate
      - name: Verify the pinned native provider against RFC 9180
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 test --locked --manifest-path crypto/openmls-wasm/Cargo.toml --test hpke_suite1
