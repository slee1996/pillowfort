name: Publish MCP release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-check:
    uses: ./.github/workflows/release-check.yml

  publish:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Require the matching immutable npm release
        run: |
          set -euo pipefail
          version="$(node -p 'require("./server.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(npm view "@ontologic/pillowfort-agent@$version" version)" = "$version"
      - name: Install Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify and extract the pinned publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate with repository-scoped OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish the checked catalog release
        run: ./mcp-publisher publish
