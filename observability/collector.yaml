extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        include_metadata: false

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80

  # Conditions are ORed: reject everything outside the operational contract.
  # Propagate errors rather than letting an unsanitized payload continue.
  filter/operational:
    error_mode: propagate
    trace_conditions:
      - scope.name != "pillowfort.operational"
      - resource.attributes["service.name"] != "pillowfort.app" and resource.attributes["service.name"] != "pillowfort.marketing" and resource.attributes["service.name"] != "pillowfort.hosted-mcp"
      - resource.attributes["deployment.environment.name"] != "production" and resource.attributes["deployment.environment.name"] != "development" and resource.attributes["deployment.environment.name"] != "test"
      - span.name != "http.server.request"
      - span.kind != SPAN_KIND_SERVER
      - span.attributes["pillowfort.operation"] != "page" and span.attributes["pillowfort.operation"] != "commerce" and span.attributes["pillowfort.operation"] != "mcp" and span.attributes["pillowfort.operation"] != "auth" and span.attributes["pillowfort.operation"] != "health"
      - span.attributes["http.request.method"] != "GET" and span.attributes["http.request.method"] != "HEAD" and span.attributes["http.request.method"] != "POST" and span.attributes["http.request.method"] != "PUT" and span.attributes["http.request.method"] != "PATCH" and span.attributes["http.request.method"] != "DELETE" and span.attributes["http.request.method"] != "OPTIONS" and span.attributes["http.request.method"] != "CONNECT" and span.attributes["http.request.method"] != "TRACE" and span.attributes["http.request.method"] != "OTHER" and span.attributes["http.request.method"] != "_OTHER"
      - not IsInt(span.attributes["http.response.status_code"])
      - span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599

  filter/volume:
    error_mode: propagate
    trace_conditions:
      - scope.name != "pillowfort.volume"
      - resource.attributes["service.name"] != "pillowfort.app"
      - resource.attributes["deployment.environment.name"] != "production" and resource.attributes["deployment.environment.name"] != "development" and resource.attributes["deployment.environment.name"] != "test"
      - span.name != "room.activity"
      - span.kind != SPAN_KIND_INTERNAL
      - span.attributes["pillowfort.activity"] != "room.created" and span.attributes["pillowfort.activity"] != "room.retired" and span.attributes["pillowfort.activity"] != "application.accepted" and span.attributes["pillowfort.activity"] != "member.admitted"

  # Both tool streams share the same closed vocabulary. Unknown requested names
  # must already be normalized to _unknown by the hosted dispatcher.
  filter/mcp_tools:
    error_mode: propagate
    trace_conditions:
      - scope.name != "pillowfort.mcp.tools" and scope.name != "pillowfort.mcp.tools.trace"
      - resource.attributes["service.name"] != "pillowfort.hosted-mcp"
      - resource.attributes["deployment.environment.name"] != "production" and resource.attributes["deployment.environment.name"] != "development" and resource.attributes["deployment.environment.name"] != "test"
      - span.name != "mcp.tool.call"
      - span.kind != SPAN_KIND_INTERNAL
      # Keep this exact-name allowlist aligned with docs/agents/tools.json.
      - not IsString(span.attributes["pillowfort.tool"])
      - not IsMatch(span.attributes["pillowfort.tool"], "^(_unknown|session_create|session_list|session_close|session_observe|session_wait|participant_preflight|room_setup|room_join|room_join_link|room_recover|room_cancel|invitation_export|admission_approve|admission_reject|chat_send|chat_format|chat_format_reset|chat_history_export|chat_verify_received|drawing_history_export|event_history_export|typing_send|presence_set|theme_set|host_toss|host_accept|host_reject|room_leave|room_end|drawing_send|vote_start|vote_cast|rps_challenge|rps_accept|rps_decline|rps_cancel|rps_forfeit|ttt_challenge|ttt_accept|ttt_decline|ttt_cancel|ttt_forfeit|rps_pick|ttt_move|saboteur_start|saboteur_accuse|saboteur_vote|saboteur_strike|koth_challenge|member_mute|game_result_dismiss|breakout_start|breakout_move|breakout_reset|breakout_stop|drawing_open|drawing_close|drawing_color|drawing_export_png|fort_pass_status|fort_pass_code_check|fort_pass_checkout_prepare|fort_pass_redeem)$")
      - span.attributes["pillowfort.outcome"] != "success" and span.attributes["pillowfort.outcome"] != "error"
      - span.attributes["pillowfort.error"] != "none" and span.attributes["pillowfort.error"] != "invalid_input" and span.attributes["pillowfort.error"] != "unknown_tool" and span.attributes["pillowfort.error"] != "busy" and span.attributes["pillowfort.error"] != "quota" and span.attributes["pillowfort.error"] != "timeout" and span.attributes["pillowfort.error"] != "connection" and span.attributes["pillowfort.error"] != "session" and span.attributes["pillowfort.error"] != "internal"
      - span.attributes["pillowfort.outcome"] == "success" and span.attributes["pillowfort.error"] != "none"
      - span.attributes["pillowfort.outcome"] == "error" and span.attributes["pillowfort.error"] == "none"

  filter/mcp_tools_metrics_scope:
    error_mode: propagate
    trace_conditions:
      - scope.name != "pillowfort.mcp.tools"
  filter/mcp_tools_trace_scope:
    error_mode: propagate
    trace_conditions:
      - scope.name != "pillowfort.mcp.tools.trace"

  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
          - delete_key(resource.attributes, "service.version") where not IsString(resource.attributes["service.version"])
          - delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] != nil and not IsMatch(resource.attributes["service.version"], "^([0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9.-]+)?([+][A-Za-z0-9.-]+)?|[a-f0-9]{7,40})$")
          - delete_key(resource.attributes, "telemetry.sdk.version") where not IsString(resource.attributes["telemetry.sdk.version"])
          - delete_key(resource.attributes, "telemetry.sdk.version") where resource.attributes["telemetry.sdk.version"] != nil and not IsMatch(resource.attributes["telemetry.sdk.version"], "^[0-9]+[.][0-9]+[.][0-9]+$")
          - delete_key(resource.attributes, "telemetry.sdk.name") where resource.attributes["telemetry.sdk.name"] != "opentelemetry"
          - delete_key(resource.attributes, "telemetry.sdk.language") where resource.attributes["telemetry.sdk.language"] != "webjs" and resource.attributes["telemetry.sdk.language"] != "nodejs"
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.version, "")
      - context: span
        statements:
          - keep_keys(span.attributes, ["http.request.method", "http.response.status_code", "pillowfort.operation", "error.type"])
          - delete_key(span.attributes, "error.type") where span.attributes["error.type"] != "internal_error"
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - set(span.parent_span_id, SpanID(0x0000000000000000))
          # Collector is launched with +ottl.set.allowNil; [] is NOT a message slice.
          - set(span.events, nil)
          - set(span.links, nil)

  transform/volume_privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
          - delete_key(resource.attributes, "service.version") where not IsString(resource.attributes["service.version"])
          - delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] != nil and not IsMatch(resource.attributes["service.version"], "^([0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9.-]+)?([+][A-Za-z0-9.-]+)?|[a-f0-9]{7,40})$")
          - delete_key(resource.attributes, "telemetry.sdk.version") where not IsString(resource.attributes["telemetry.sdk.version"])
          - delete_key(resource.attributes, "telemetry.sdk.version") where resource.attributes["telemetry.sdk.version"] != nil and not IsMatch(resource.attributes["telemetry.sdk.version"], "^[0-9]+[.][0-9]+[.][0-9]+$")
          - delete_key(resource.attributes, "telemetry.sdk.name") where resource.attributes["telemetry.sdk.name"] != "opentelemetry"
          - delete_key(resource.attributes, "telemetry.sdk.language") where resource.attributes["telemetry.sdk.language"] != "webjs" and resource.attributes["telemetry.sdk.language"] != "nodejs"
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.version, "")
      - context: span
        statements:
          - keep_keys(span.attributes, ["pillowfort.activity"])
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - set(span.parent_span_id, SpanID(0x0000000000000000))
          - set(span.events, nil)
          - set(span.links, nil)

  transform/mcp_tools_privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
          - delete_key(resource.attributes, "service.version") where not IsString(resource.attributes["service.version"])
          - delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] != nil and not IsMatch(resource.attributes["service.version"], "^([0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9.-]+)?([+][A-Za-z0-9.-]+)?|[a-f0-9]{7,40})$")
          - delete_key(resource.attributes, "telemetry.sdk.version") where not IsString(resource.attributes["telemetry.sdk.version"])
          - delete_key(resource.attributes, "telemetry.sdk.version") where resource.attributes["telemetry.sdk.version"] != nil and not IsMatch(resource.attributes["telemetry.sdk.version"], "^[0-9]+[.][0-9]+[.][0-9]+$")
          - delete_key(resource.attributes, "telemetry.sdk.name") where resource.attributes["telemetry.sdk.name"] != "opentelemetry"
          - delete_key(resource.attributes, "telemetry.sdk.language") where resource.attributes["telemetry.sdk.language"] != "webjs" and resource.attributes["telemetry.sdk.language"] != "nodejs"
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.version, "")
      - context: span
        statements:
          - keep_keys(span.attributes, ["pillowfort.tool", "pillowfort.outcome", "pillowfort.error"])
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - set(span.parent_span_id, SpanID(0x0000000000000000))
          - set(span.events, nil)
          - set(span.links, nil)

  batch/traces:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s
  batch/volume:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s
  batch/mcp_tools:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s
  batch/mcp_tools_trace:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s
  batch/metrics:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 1s

connectors:
  span_metrics:
    namespace: pillowfort.operational
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: pillowfort.operation
      - name: deployment.environment.name
      - name: http.response.status_code
    # Exactly one collector writes this local stream. No per-process identity labels.
    exclude_dimensions: [collector.instance.id]
    resource_metrics_key_attributes: [service.name, deployment.environment.name]
    resource_metrics_cache_size: 16
    aggregation_cardinality_limit: 4096
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    metrics_expiration: 1h
    series_expiration: 1h
    include_instrumentation_scope: [pillowfort.operational]
    exemplars:
      enabled: true
      max_per_data_point: 1

  # One collector aggregates unsampled count events from all room instances.
  # No per-room labels, duration histograms, exemplars, or stored activity traces.
  span_metrics/volume:
    namespace: pillowfort.volume
    histogram:
      disable: true
    dimensions:
      - name: pillowfort.activity
      - name: deployment.environment.name
    exclude_dimensions: [collector.instance.id, span.name, span.kind, status.code]
    resource_metrics_key_attributes: [service.name, deployment.environment.name]
    resource_metrics_cache_size: 16
    aggregation_cardinality_limit: 64
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    metrics_expiration: 0s
    series_expiration: 0s
    include_instrumentation_scope: [pillowfort.volume]
    exemplars:
      enabled: false

  # Unsampled tool execution spans are aggregated here, never stored in Tempo.
  # Sampled diagnostic spans use a different scope and bypass all connectors.
  span_metrics/mcp_tools:
    namespace: pillowfort.mcp_tools
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: pillowfort.tool
      - name: pillowfort.outcome
      - name: pillowfort.error
      - name: deployment.environment.name
    exclude_dimensions: [collector.instance.id, span.name, span.kind, status.code]
    resource_metrics_key_attributes: [service.name, deployment.environment.name]
    resource_metrics_cache_size: 16
    aggregation_cardinality_limit: 4096
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    metrics_expiration: 0s
    series_expiration: 0s
    include_instrumentation_scope: [pillowfort.mcp.tools]
    exemplars:
      enabled: false

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 3s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 128
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:8889
    translation_strategy: UnderscoreEscapingWithSuffixes
    enable_open_metrics: true
    without_scope_info: true
    metric_expiration: 5m

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/operational, transform/privacy, batch/traces]
      exporters: [otlp_http/tempo, span_metrics]
    traces/volume:
      receivers: [otlp]
      processors: [memory_limiter, filter/volume, transform/volume_privacy, batch/volume]
      exporters: [span_metrics/volume]
    traces/mcp_tools:
      receivers: [otlp]
      processors: [memory_limiter, filter/mcp_tools_metrics_scope, filter/mcp_tools, transform/mcp_tools_privacy, batch/mcp_tools]
      exporters: [span_metrics/mcp_tools]
    traces/mcp_tools_trace:
      receivers: [otlp]
      processors: [memory_limiter, filter/mcp_tools_trace_scope, filter/mcp_tools, transform/mcp_tools_privacy, batch/mcp_tools_trace]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [span_metrics, span_metrics/volume, span_metrics/mcp_tools]
      processors: [memory_limiter, batch/metrics]
      exporters: [prometheus]
