global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pillowfort-operational
    static_configs:
      - targets: [collector:8889]
    # Allowlisted operational histograms and aggregate volume counters only.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: pillowfort_(operational_(calls_total|duration_seconds_(bucket|sum|count))|volume_calls_total)
        action: keep
