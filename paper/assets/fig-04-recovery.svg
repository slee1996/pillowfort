<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 365" role="img"><style>text{font-family:"Times New Roman",Times,serif;fill:currentColor}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="currentColor" stroke-width="1.1"/></marker></defs><rect x="25" y="45" width="160" height="66" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="105.0" y="69" font-size="17" text-anchor="middle" font-weight="bold"><tspan x="105.0" dy="0">Ready</tspan></text><text x="105.0" y="91" font-size="14" text-anchor="middle"><tspan x="105.0" dy="0">No pending operation</tspan></text><rect x="300" y="45" width="180" height="66" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="390.0" y="69" font-size="17" text-anchor="middle" font-weight="bold"><tspan x="390.0" dy="0">Pending committed</tspan></text><text x="390.0" y="91" font-size="14" text-anchor="middle"><tspan x="390.0" dy="0">Stored frame and identity</tspan></text><rect x="570" y="45" width="180" height="66" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="660.0" y="69" font-size="17" text-anchor="middle" font-weight="bold"><tspan x="660.0" dy="0">Result committed</tspan></text><text x="660.0" y="91" font-size="14" text-anchor="middle"><tspan x="660.0" dy="0">Outcome stored locally</tspan></text><rect x="300" y="220" width="180" height="66" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="390.0" y="244" font-size="17" text-anchor="middle" font-weight="bold"><tspan x="390.0" dy="0">Reconcile</tspan></text><text x="390.0" y="266" font-size="14" text-anchor="middle"><tspan x="390.0" dy="0">Restore committed state</tspan></text><rect x="570" y="220" width="180" height="66" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="660.0" y="244" font-size="17" text-anchor="middle" font-weight="bold"><tspan x="660.0" dy="0">Settled</tspan></text><text x="660.0" y="266" font-size="14" text-anchor="middle"><tspan x="660.0" dy="0">Exact ACK reconciled</tspan></text><polyline points="185,78 300,78" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="242" y="22" font-size="14" text-anchor="middle"><tspan x="242" dy="0">Grant; persist</tspan><tspan x="242" dy="17.36">sender transition</tspan></text><polyline points="480,78 570,78" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="525" y="22" font-size="14" text-anchor="middle"><tspan x="525" dy="0">Receive result;</tspan><tspan x="525" dy="17.36">persist decision</tspan></text><polyline points="390,111 390,220" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="403" y="160" font-size="14" text-anchor="start"><tspan x="403" dy="0">Crash or</tspan><tspan x="403" dy="17.36">disconnect</tspan></text><polyline points="330,220 330,111" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="315" y="165" font-size="14" text-anchor="end"><tspan x="315" dy="0">Stored outbox;</tspan><tspan x="315" dy="17.36">same operation</tspan></text><polyline points="480,253 525,253 525,78 570,78" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="535" y="163" font-size="14" text-anchor="start"><tspan x="535" dy="0">Stored</tspan><tspan x="535" dy="17.36">result</tspan></text><polyline points="660,111 660,220" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="674" y="165" font-size="14" text-anchor="start"><tspan x="674" dy="0">Exact</tspan><tspan x="674" dy="17.36">ACK</tspan></text><polyline points="750,78 770,78 770,345 390,345 390,286" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/><text x="605" y="330" font-size="14" text-anchor="middle"><tspan x="605" dy="0">Restart before ACK completion</tspan></text></svg>
