<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 725" role="img">
  <style>text{font-family:&quot;Times New Roman&quot;,Times,serif;fill:currentColor}</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="currentColor" stroke-width="1.1"/>
    </marker>
  </defs>
  <rect x="25" y="20" width="170" height="44" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="110" y="48" font-size="18" text-anchor="middle">
    <tspan x="110" dy="0">Incumbent host H</tspan>
  </text>
  <polyline points="110,64 110,235" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
  <rect x="305" y="20" width="170" height="44" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="390" y="48" font-size="18" text-anchor="middle">
    <tspan x="390" dy="0">Relay R</tspan>
  </text>
  <polyline points="390,64 390,680" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
  <rect x="585" y="20" width="170" height="44" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="670" y="48" font-size="18" text-anchor="middle">
    <tspan x="670" dy="0">Candidate D</tspan>
  </text>
  <polyline points="670,64 670,680" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
  <polyline points="110,100 390,100" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="250.0" y="92" font-size="15" text-anchor="middle">
    <tspan x="250.0" dy="0">Signed join-order policy</tspan>
  </text>
  <polyline points="390,150 670,150" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="530.0" y="142" font-size="15" text-anchor="middle">
    <tspan x="530.0" dy="0">Protected policy delivered</tspan>
  </text>
  <rect x="140" y="165" width="225" height="52" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="252.5" y="187" font-size="15" text-anchor="middle">
    <tspan x="252.5" dy="0">Host software maintains order;</tspan>
    <tspan x="252.5" dy="18.6">reconnect does not reorder</tspan>
  </text>
  <polyline points="100,225 120,245" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <polyline points="100,245 120,225" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="135" y="243" font-size="15" text-anchor="start">
    <tspan x="135" dy="0">Host disconnects</tspan>
  </text>
  <rect x="425" y="220" width="225" height="71" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="537.5" y="242" font-size="15" text-anchor="middle">
    <tspan x="537.5" dy="0">120 s disconnect grace</tspan>
    <tspan x="537.5" dy="18.6">Select earliest eligible device</tspan>
    <tspan x="537.5" dy="18.6">Fence expired host identity</tspan>
  </text>
  <polyline points="390,330 670,330" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="530.0" y="322" font-size="15" text-anchor="middle">
    <tspan x="530.0" dy="0">30 s bound authorization</tspan>
  </text>
  <rect x="425" y="350" width="225" height="71" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="537.5" y="372" font-size="15" text-anchor="middle">
    <tspan x="537.5" dy="0">Persist authorization; ACK</tspan>
    <tspan x="537.5" dy="18.6">Explicit choice: catch or duck</tspan>
    <tspan x="537.5" dy="18.6">Sign the selected response</tspan>
  </text>
  <polyline points="670,450 390,450" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="530.0" y="442" font-size="15" text-anchor="middle">
    <tspan x="530.0" dy="0">Signed acceptance or refusal</tspan>
  </text>
  <rect x="140" y="470" width="225" height="71" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="252.5" y="492" font-size="15" text-anchor="middle">
    <tspan x="252.5" dy="0">Verify policy and response</tspan>
    <tspan x="252.5" dy="18.6">Accept: commit host authority</tspan>
    <tspan x="252.5" dy="18.6">Decline: next offer, or collapse</tspan>
  </text>
  <polyline points="390,545 90,545 90,330 390,330" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="140" y="350" width="225" height="71" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="252.5" y="372" font-size="15" text-anchor="middle">
    <tspan x="252.5" dy="0">On refusal or expiry:</tspan>
    <tspan x="252.5" dy="18.6">offer next eligible member;</tspan>
    <tspan x="252.5" dy="18.6">none remain: collapse fort</tspan>
  </text>
  <polyline points="390,565 670,565" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="530.0" y="557" font-size="15" text-anchor="middle">
    <tspan x="530.0" dy="0">If accepted: retained result</tspan>
  </text>
  <rect x="425" y="580" width="225" height="52" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <text x="537.5" y="602" font-size="15" text-anchor="middle">
    <tspan x="537.5" dy="0">Complete former-host Remove</tspan>
    <tspan x="537.5" dy="18.6">Reconcile retirement lifecycle</tspan>
  </text>
  <polyline points="670,660 390,660" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="530.0" y="652" font-size="15" text-anchor="middle">
    <tspan x="530.0" dy="0">Exact MLS Remove and completion</tspan>
  </text>
  <text x="390" y="703" font-size="15" text-anchor="middle" font-style="italic">
    <tspan x="390" dy="0">All decline → fort collapses</tspan>
  </text>
  <text x="670" y="703" font-size="15" text-anchor="middle" font-style="italic">
    <tspan x="670" dy="0">New host</tspan>
  </text>
</svg>
