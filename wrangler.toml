name = "pillowfort"
main = "src/index.ts"
compatibility_date = "2026-07-20"

[assets]
directory = "./client/dist"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = false

[vars]
OTEL_ENABLED = "false"
OTEL_DEPLOYMENT_ENVIRONMENT = "production"
OTEL_SERVICE_VERSION = "1.1.0"
OTEL_SAMPLE_RATE = "1"
